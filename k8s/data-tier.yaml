# Postgres and Redis running inside the cluster. Single replica each, no
# persistent volume - this is a demo, data is disposable. In prod these would be
# managed RDS + ElastiCache (I'd say this if asked), not pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB, value: payments }
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db           
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis        # hostname for REDIS_URL
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379